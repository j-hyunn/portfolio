<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Jehyun | PM Portfolio</title>
    <script>
      // GitHub Pages SPA fallback: redirect deep links to index.html
      // so client-side routing (react-router) can take over.
      var pathSegmentsToKeep = 1 // keep "/portfolio"
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?p=' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
